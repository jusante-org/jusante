# Ambiente do Jusante: banco geográfico, armazenamento de fotos e backend.
# Uso: copie .env.exemplo para .env, ajuste as senhas e rode `docker compose up -d`.
name: jusante

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - dados-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - dados-minio:/data
    ports:
      - "9001:9001"  # console de administração do MinIO

  backend:
    build: ../backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      JUSANTE_MEDIA_ROOT: /app/media
    volumes:
      - dados-media:/app/media
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  dados-db:
  dados-minio:
  dados-media:
